name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # The runner's Android SDK builds the Compose module.
      - run: ./gradlew :wajub-mobile-core:test :wajub-mobile-compose:testReleaseUnitTest :wajub-mobile-compose:assembleRelease --no-daemon
