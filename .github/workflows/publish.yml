# Publishes wajub-mobile-core and wajub-mobile-compose to Maven Central when a
# tag vX.Y.Z is pushed. Repository secrets (Settings → Secrets → Actions):
#   MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD — a Central Portal user token
#   SIGNING_KEY — the ASCII-armored private key (gpg --armor --export-secret-keys <id>)
#   SIGNING_KEY_PASSWORD — its passphrase
name: Publish to Maven Central

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches gradle.properties
        run: |
          version=$(sed -n 's/^wajubVersion=//p' gradle.properties)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "gradle.properties says $version, tag is $GITHUB_REF_NAME"; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :wajub-mobile-core:test --no-daemon
      - run: ./gradlew publishAndReleaseToMavenCentral --no-daemon --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
